<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Ignitra - Let's work together on your digital marketing needs">
  <link rel="stylesheet" href="styles.css">
  <title>Contact Ignitra</title>
</head>
<body>

<header id="header">
  <a id="logo" href="index.html">LOGO</a>

  <nav id="nav-bar" aria-label="Main navigation">
    <a class="nav-a" href="index.html">Home</a>
    <a class="nav-a" href="about.html">About</a>
    <a class="nav-a" href="services.html">Services</a>
    <a class="nav-a" href="contact.html" aria-current="page">Contact</a>
  </nav>
</header>

<section id="hero-section">
  <div id="content">
    <h1 id="h1">Get In Touch</h1>
    <p id="p1">Let's ignite your digital presence together</p>
  </div>
</section>

<section class="contact-card">
  <form action="#" method="post">
    <h2>LETS WORK <span class="accent-green">TOGETHER</span></h2>

    <div class="input-row">
      <label for="contact-name" class="sr-only">Name</label>
      <input type="text" id="contact-name" name="name" placeholder="Name*" required>
      
      <label for="contact-phone" class="sr-only">Phone Number</label>
      <input type="tel" id="contact-phone" name="phone" placeholder="Phone Number">
    </div>

    <label for="contact-email" class="sr-only">Email</label>
    <input type="email" id="contact-email" name="email" placeholder="Email ID*" required>
    
    <label for="contact-message" class="sr-only">Message</label>
    <textarea id="contact-message" name="message" placeholder="Message*" rows="5" required></textarea>

    <button type="submit" class="btn-submit">SUBMIT</button>
  </form>
</section>

<footer id="footer">
  <p>&copy; 2025 Ignitra</p>
  <nav id="nav-barft" aria-label="Footer navigation">
    <a class="nav-a" href="index.html">Home</a>
    <a class="nav-a" href="about.html">About</a>
    <a class="nav-a" href="services.html">Services</a>
    <a class="nav-a" href="contact.html">Contact</a>
  </nav>
</footer>

</body>
</html>
